name: Aggiorna database kanji
on:
  workflow_dispatch:
    inputs:
      totale:
        description: Numero di kanji
        default: "4000"
  push:
    paths: ['data/it.json']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-db.js ${{ inputs.totale }}
      - name: Salva le modifiche
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Aggiorna database kanji"
          git push
